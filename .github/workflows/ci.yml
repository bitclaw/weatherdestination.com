name: CI

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]

# Default token scope, not the repo default - the workflow only ever reads
# the checked-out code, it never needs to write anything. No secret is
# consumed here today (confirmed: no `secrets.*` anywhere in this file), but
# this stays correct if a future step ever needs to be audited for what it
# could reach.
permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # SHA-pinned, not the floating major-version tag - a compromised or
      # force-pushed tag would otherwise execute arbitrary code in this
      # workflow. Bump deliberately (Renovate already tracks npm deps in
      # this repo; GitHub Actions could be added to its config too) rather
      # than picking up whatever a tag currently points to.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: CI
        run: make ci
