[install]
ignoreScripts = true
# Only install versions published at least 3 days ago: most hijacked npm
# releases are caught within hours. Excludes are first-party packages only.
# Policy and the security-fix bypass: docs/warpkit/patterns/dependency-release-age.md
minimumReleaseAge = 259200
minimumReleaseAgeExcludes = ["@bitclaw/loadtest", "@bitclaw/sqlite", "@bitclaw/jobs", "@bitclaw/result", "@bitclaw/disposable-email"]

[test]
preload = ["./src/test/setup.ts"]

[test.env]
NODE_ENV = "test"
